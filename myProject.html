    <div class="d-flex flex-column align-items-center p-5 gap-3">
        <h1 class="text-uppercase fw-bold">add my project</h1>
        <form id="projectForm">
            <div class="mb-3">
                <label for="projectName" class="form-label">Project Name</label>
                <input type="text" class="form-control" id="projectName" required>
            </div>
            <div class="mb-3 d-flex gap-2">
                <div>
                    <label for="startDate" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="startDate" required>
                </div>
                <div>
                    <label for="endDate" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="endDate" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="5" required></textarea>
            </div>
            <div class="mb-3">
                <label>Technologies</label>
                <div class="d-flex gap-5">
                    <div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="node-js">
                            <label class="form-check-label fw-normal" for="node-js">
                                Node Js
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="react">
                            <label class="form-check-label fw-normal" for="react">
                                React Js
                            </label>
                        </div>
                    </div>
                    <div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="n">
                            <label class="form-check-label fw-normal" for="n">
                                Next Js
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="t">
                            <label class="form-check-label fw-normal" for="t">
                                TypeScript
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label for="image" class="form-label">Upload Image</label>
                <input type="file" class="form-control" id="image" accept="image/*" required>
            </div>
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-dark rounded-5">Submit</button>
            </div>
        </form>
    </div>
    <div class="bg-white mt-4 p-5">
        <h1 class="text-uppercase fw-bold text-center">my project</h1>
        <div class="d-flex mt-3 gap-4" id="container"></div>
